name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"

      - name: The tag matches the package version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="$(uv version --short)"
          echo "tag=$VERSION pyproject=$PKG"
          test "$VERSION" = "$PKG"

      - run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI (Trusted Publishing)
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/ga4-seo-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # OIDC, no API token: configure the Trusted Publisher on pypi.org first
      # (owner GermaniU, repo ga4-seo-mcp, workflow release.yml, environment pypi).
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  image:
    name: Multi-arch image to GHCR
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/germaniu/ga4-seo-mcp
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Publishes server.json to registry.modelcontextprotocol.io. GitHub OIDC login: no secrets, and
  # the registry only grants the io.github.GermaniU/* namespace. The registry downloads both
  # packages to verify ownership, so the GHCR package must be public.
  mcp-registry:
    name: Publish to the MCP Registry
    runs-on: ubuntu-latest
    needs: [pypi, image]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Version and image of server.json from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '
            .version = $v
            | .packages |= map(
                if .registryType == "oci" then .identifier = "ghcr.io/germaniu/ga4-seo-mcp:" + $v
                else .version = $v end)
          ' server.json > server.tmp && mv server.tmp server.json
          cat server.json

      - name: Install mcp-publisher
        run: |
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" \
            | tar xz mcp-publisher

      - run: ./mcp-publisher login github-oidc

      - run: ./mcp-publisher publish
